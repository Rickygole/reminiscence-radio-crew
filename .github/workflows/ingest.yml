name: ingest
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: crew-data
jobs:
  ingest:
    if: vars.LIVE_MODE == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository (v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node (v4)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node bin/crew.js ingest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FAMILY_ALLOWLIST: ${{ secrets.FAMILY_ALLOWLIST }}
      - name: Save new inbox items
        run: |
          git config user.name "crew-bot"
          git config user.email "crew-bot@users.noreply.github.com"
          git add -f data/reminders.json
          git diff --cached --quiet || git commit -m "Save new family messages"
          git push
