name: ingest
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: crew-data
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node bin/crew.js ingest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FAMILY_ALLOWLIST: ${{ secrets.FAMILY_ALLOWLIST }}
      - name: Save new inbox items
        run: |
          git config user.name "crew-bot"
          git config user.email "crew-bot@users.noreply.github.com"
          git add -f inbox data/reminders.json
          git diff --cached --quiet || git commit -m "Save new family messages"
          git push
