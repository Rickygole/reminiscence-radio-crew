name: nightly
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: crew-data
jobs:
  build-show:
    if: vars.LIVE_MODE == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository (v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node (v4)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: node bin/crew.js run --date "$(date -u +%F)" --out public
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          POLLY_VOICE: ${{ vars.POLLY_VOICE }}
          LLM_MODEL_ID: ${{ secrets.LLM_MODEL_ID }}
      - name: Save the published show
        run: |
          git config user.name "crew-bot"
          git config user.email "crew-bot@users.noreply.github.com"
          git add -f public
          git diff --cached --quiet || git commit -m "Publish the daily show"
          git push
