name: nightly
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: crew-data
jobs:
  build-show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm install --no-save @aws-sdk/client-polly @aws-sdk/client-bedrock-runtime
      - run: node bin/crew.js run --date "$(date -u +%F)" --out public
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          POLLY_VOICE: ${{ vars.POLLY_VOICE }}
          LLM_MODEL_ID: ${{ secrets.LLM_MODEL_ID }}
      - name: Save the published show
        run: |
          git config user.name "crew-bot"
          git config user.email "crew-bot@users.noreply.github.com"
          git add -f public
          git diff --cached --quiet || git commit -m "Publish the daily show"
          git push
